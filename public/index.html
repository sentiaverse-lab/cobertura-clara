<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vielsin · Tu copago, claro antes de atenderte</title>
  <link rel="icon" type="image/svg+xml" href="/vielsin-avatar.svg" />
  <meta name="description" content="Asistente conversacional que estima tu copago y te recomienda el hospital de tu red mas economico segun tu plan de seguro." />
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#020617" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vielsin" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.10); }
    .grad-text { background: linear-gradient(90deg,#5eead4,#38bdf8,#818cf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .glow { box-shadow: 0 0 40px -8px rgba(56,189,248,0.5); }
    @keyframes fadeUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .4s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes pop { 0%{transform:scale(.85);opacity:0} 60%{transform:scale(1.04)} 100%{transform:scale(1);opacity:1} }
    .pop { animation: pop .45s cubic-bezier(.2,.8,.3,1) both; }
    @keyframes pulseDot { 0%,100%{opacity:.35} 50%{opacity:1} }
    .typing span { animation: pulseDot 1.2s infinite; display:inline-block; }
    .typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
    .bar-fill { transition: width 1s cubic-bezier(.2,.8,.2,1); }
    .aurora { background:
        radial-gradient(60% 60% at 20% 10%, rgba(56,189,248,.16), transparent 60%),
        radial-gradient(50% 50% at 90% 20%, rgba(129,140,248,.16), transparent 60%),
        radial-gradient(60% 60% at 50% 100%, rgba(45,212,191,.14), transparent 60%); }
    #stream::-webkit-scrollbar{width:8px} #stream::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px}
    /* Fondo ECG (electrocardiograma). CSS/SVG puro. El giroscopio (si existe) lo desplaza. */
    .ecg-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    /* Contenedor que reacciona al giroscopio via variables --tx / --ty */
    .ecg-tilt { position: absolute; inset: -60px; transform: translate(var(--tx, 0px), var(--ty, 0px)); transition: transform .25s ease-out; }
    .ecg-line { position: absolute; top: 50%; left: 0; width: 200%; height: 140px; transform: translateY(-50%); opacity: .22; animation: ecgmove 7s linear infinite; }
    @keyframes ecgmove { from { transform: translateY(-50%) translateX(0); } to { transform: translateY(-50%) translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { .ecg-line { animation: none; } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 aurora flex flex-col h-full">
  <!-- Fondo animado: pulso de electrocardiograma (reacciona al giroscopio en movil) -->
  <div class="ecg-bg" aria-hidden="true">
   <div class="ecg-tilt" id="ecgTilt">
    <svg class="ecg-line" viewBox="0 0 800 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ecgGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#5eead4" stop-opacity="1"/>
          <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0 70 H30 q4 0 6 -6 q3 -10 6 0 q2 6 6 6 H62 l6 2 l5 20 l7 -74 l7 96 l6 -44 l5 0 q4 0 7 -4 q10 -16 18 0 q3 4 7 4 H190 q4 0 6 -6 q3 -10 6 0 q2 6 6 6 H222 l6 2 l5 20 l7 -74 l7 96 l6 -44 l5 0 q4 0 7 -4 q10 -16 18 0 q3 4 7 4 H350 q4 0 6 -6 q3 -10 6 0 q2 6 6 6 H382 l6 2 l5 20 l7 -74 l7 96 l6 -44 l5 0 q4 0 7 -4 q10 -16 18 0 q3 4 7 4 H510 q4 0 6 -6 q3 -10 6 0 q2 6 6 6 H542 l6 2 l5 20 l7 -74 l7 96 l6 -44 l5 0 q4 0 7 -4 q10 -16 18 0 q3 4 7 4 H670 q4 0 6 -6 q3 -10 6 0 q2 6 6 6 H702 l6 2 l5 20 l7 -74 l7 96 l6 -44 l5 0 q4 0 7 -4 q10 -16 18 0 q3 4 7 4 H800"
        fill="none" stroke="url(#ecgGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
   </div>
  </div>

  <div class="relative z-10 w-full max-w-3xl mx-auto flex flex-col h-full px-4">

    <!-- Header compacto (responsive: controles bajan a 2a fila en movil) -->
    <header class="pt-4 pb-3 shrink-0">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="flex items-center gap-2.5 min-w-0">
          <img src="/vielsin-avatar.svg" alt="Vielsin" class="w-9 h-9 rounded-2xl glow shrink-0" />
          <div class="min-w-0">
            <h1 class="text-base font-extrabold leading-tight grad-text">Vielsin</h1>
            <p id="tagline" class="hidden sm:block text-[11px] text-slate-400 leading-tight truncate">Tu copago y mejor hospital, antes de atenderte</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 flex-wrap justify-end">
          <button id="langBtn" title="Español / English"
            class="bg-slate-900/70 border border-white/10 rounded-lg px-2 py-1.5 text-[11px] font-semibold text-slate-300 hover:text-teal-300 hover:border-teal-400/40 transition">
            <span id="langLabel">EN</span>
          </button>
          <button id="geoBtn"
            class="bg-slate-900/70 border border-white/10 rounded-lg px-2 py-1.5 text-[11px] text-slate-300 hover:text-teal-300 hover:border-teal-400/40 transition">
            <span id="geoIcon">📍</span><span id="geoLabel" class="hidden md:inline ml-1">Usar mi ubicación</span>
          </button>
          <button id="voiceBtn"
            class="bg-slate-900/70 border border-white/10 rounded-lg px-2 py-1.5 text-[11px] text-slate-300 hover:text-teal-300 hover:border-teal-400/40 transition">
            <span id="voiceIcon">🔈</span>
          </button>
          <select id="planSelect"
            class="bg-slate-900/70 border border-white/10 rounded-lg px-2 py-1.5 text-[11px] max-w-[46vw] sm:max-w-none focus:outline-none focus:ring-2 focus:ring-teal-400/60">
            <option value="">Plan: preguntar en el chat</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Conversacion (scrollable) -->
    <main id="stream" class="flex-1 overflow-y-auto space-y-3 py-3 pr-1"></main>

    <!-- Barra de escritura (siempre activa) -->
    <footer class="shrink-0 pb-4 pt-2">
      <div class="glass rounded-2xl p-2 flex items-end gap-2">
        <textarea id="input" rows="1" placeholder="Escribe o dicta... ej: me duele el pecho, tengo Plan Plus"
          class="flex-1 bg-transparent resize-none max-h-32 px-3 py-2.5 text-sm focus:outline-none placeholder:text-slate-500"></textarea>
        <button id="micBtn" title="Dictar por voz"
          class="shrink-0 w-11 h-11 rounded-xl bg-slate-800/70 border border-white/10 text-slate-300 hover:text-teal-300 hover:border-teal-400/40 transition flex items-center justify-center">
          🎤
        </button>
        <button id="sendBtn"
          class="shrink-0 w-11 h-11 rounded-xl bg-gradient-to-r from-teal-400 to-sky-500 hover:from-teal-300 hover:to-sky-400 text-slate-900 font-bold transition disabled:opacity-40 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
      <p id="disclaimer" class="text-center text-[10px] text-slate-600 mt-2">Orientación informativa · datos de ejemplo · no sustituye tu póliza ni el criterio médico</p>
      <p id="copyright" class="text-center text-[10px] text-slate-600 mt-1">© 2026 Sentia AI · Todos los derechos reservados</p>
    </footer>
  </div>

  <script src="/i18n.js?v=8"></script>
  <script src="/device-ai.js?v=8"></script>
  <script src="/app.js?v=8"></script>
  <script>
    // Registrar el Service Worker (PWA). Falla en silencio si no hay soporte.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
